<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Leyline mark, after the full logo: the ley line through a ring, a ripple where it crosses, a small tree
       above mirrored by its roots below. Bold strokes on a dark tile so it reads at 16 px as well as large. -->
  <rect width="64" height="64" rx="14" fill="#0d0c0a"/>
  <g fill="none" stroke="#d6ad5c" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="19" stroke-width="3.5"/>
    <path d="M32 12v40" stroke-width="3.5"/>
    <ellipse cx="32" cy="32" rx="10.5" ry="3.6" stroke-width="3"/>
    <path d="M32 24.5l-6-6M32 24.5l6-6" stroke-width="3.2"/>
    <path d="M32 39.5l-6 6M32 39.5l6 6" stroke-width="3.2"/>
  </g>
  <g fill="#d6ad5c">
    <path d="M32 3l4 5-4 5-4-5z"/>
    <path d="M32 51l4 5-4 5-4-5z"/>
  </g>
</svg>
